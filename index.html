<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SwiftShop - Online Shopping</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f9;
            text-align: center;
        }
        header {
            background-color: #2c3e50;
            color: white;
            padding: 15px 0;
            margin-bottom: 30px;
        }
        .product-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        .product-card {
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            width: 220px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .product-card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 5px;
        }
        .price {
            color: #27ae60;
            font-weight: bold;
            font-size: 1.2em;
        }
    </style>
</head>
<body>

    <header>
        <h1>SwiftShop Online Store</h1>
    </header>

    <div class="product-container">
        <div class="product-card">
            <img src="https://placeholder.com" alt="Wireless Headphones">
            <h3>Wireless Headphones</h3>
            <p class="price">$49.99</p>
        </div>

        <div class="product-card">
            <img src="https://placeholder.com" alt="Smart Watch">
            <h3>Smart Watch</h3>
            <p class="price">$89.99</p>
        </div>

        <div class="product-card">
            <img src="https://placeholder.com" alt="Laptop Backpack">
            <h3>Laptop Backpack</h3>
            <p class="price">$34.50</p>
        </div>
    </div>

</body>
</html>
